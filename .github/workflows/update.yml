# ============================================================
#  update.yml —— GitHub 自动更新 B站 内容
#  .github/workflows/ 目录必须保持这个路径，文件放在这里。
#  改完 links.txt 提交后，它会自动运行并更新网站。
# ============================================================
name: 更新 B站 内容

on:
  push:
    paths:
      - "links.txt"
      - "scripts/fetch_bili.py"
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库文件
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取 B站 内容
        run: python3 scripts/fetch_bili.py
      - name: 抓取 B站 内容
        run: python3 scripts/fetch_bili.py
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/items-bili.js
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交。"
          else
            git commit -m "自动更新 B站 内容"
            git push
          fi
